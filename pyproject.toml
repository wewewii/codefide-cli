[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codefind-cli"
version = "0.1.0"
description = "Terminal code/text finder with context output and editor open support"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CodeFind Maintainer" }]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[project.scripts]
codefind = "codefind.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codefind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
